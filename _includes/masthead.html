{% include base_path %}
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-brand" href="{{ base_path }}/">
      <span class="site-brand__mark" aria-hidden="true">YZ</span>
      <span><strong>{{ site.title }}</strong><span class="site-brand__subtitle">Statistical Learning &amp; Scientific Discovery</span></span>
    </a>
    <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" hidden>
      <span>Menu</span><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5h14M2 9h14M2 13h14" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <nav id="site-nav" class="site-navigation" aria-label="Main navigation">
      <ul>
        <li><a href="{{ base_path }}/"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
        {% for link in site.data.navigation.main %}
          {% assign domain = base_path %}
          {% if link.url contains 'http' %}{% assign domain = '' %}{% endif %}
          <li><a href="{{ domain }}{{ link.url }}"{% if page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
